
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Reservation | LifeFlow</title>
    <link rel="stylesheet" href="reservation.css">
</head>
<body>

    <header>
        <a href="home.html" class="logo">♥ LifeFlow</a>
        <a href="donation camp.html" class="back">Back to Camps</a>
    </header>

    <section class="page-title">
        <p>LIFEFLOW · DONOR REGISTRATION</p>
        <h1>Reserve Your Donation</h1>
        <p>Take a small step that can make a big difference.</p>
    </section>

    <main>
        <form id="reservationForm">
            <h2>Donation Reservation Form</h2>
            <p class="intro">Fill in your details to reserve a place at a blood donation camp.</p>

            <div class="form-grid">
                <div class="field">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter your age" min="18" max="65" required>
                </div>

                <div class="field">
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" maxlength="10" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="field">
                    <label for="bloodGroup">Blood Group</label>
                    <select id="bloodGroup" required>
                        <option value="">Select blood group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>Not sure</option>
                    </select>
                </div>

                <div class="field">
                    <label for="camp">Select Donation Camp</label>
                    <select id="camp" required>
                        <option value="">Choose a camp</option>
                        <option>LifeFlow Community Camp</option>
                        <option>City Blood Donation Camp</option>
                        <option>College Donation Camp</option>
                    </select>
                </div>

                <div class="field">
                    <label for="date">Preferred Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="field">
                    <label for="time">Preferred Time</label>
                    <select id="time" required>
                        <option value="">Choose a time</option>
                        <option>9:00 AM - 11:00 AM</option>
                        <option>11:00 AM - 1:00 PM</option>
                        <option>2:00 PM - 4:00 PM</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="address">Address</label>
                <textarea id="address" rows="3" placeholder="Enter your city or address" required></textarea>
            </div>

            

            <button type="submit" class="submit-btn">Submit Reservation</button>

            <p id="message"></p>
        </form>
    </main>

    <footer>
        <p>LifeFlow · Every Drop Counts</p>
    </footer>

    <script src="reservation.js"></script>
</body>
</html>
